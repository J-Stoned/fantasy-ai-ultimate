# PostgreSQL Performance Configuration for Ryzen 5 7600X + 32GB RAM
# Optimized for Fantasy AI workload
# 
# Add these settings to your postgresql.conf file
# Location: C:\Program Files\PostgreSQL\16\data\postgresql.conf

# Memory Settings (for 32GB RAM system)
shared_buffers = 8GB              # 25% of RAM for PostgreSQL
effective_cache_size = 24GB       # 75% of RAM
maintenance_work_mem = 2GB        # For VACUUM, CREATE INDEX
work_mem = 256MB                  # For complex queries
wal_buffers = 64MB               # Write-ahead log buffer

# Connection Settings
max_connections = 200             # Plenty for local development
max_prepared_transactions = 100   # For prepared statements

# Checkpoint Settings (for SSD)
checkpoint_completion_target = 0.9
checkpoint_timeout = 15min
max_wal_size = 4GB
min_wal_size = 1GB

# Query Planner
random_page_cost = 1.1           # SSD optimization (default is 4.0)
effective_io_concurrency = 200   # SSD can handle many concurrent I/O
default_statistics_target = 1000 # Better query plans
parallel_tuple_cost = 0.1        # Encourage parallel queries
parallel_setup_cost = 1000.0     # Encourage parallel queries

# Parallel Query Settings (for 12 threads)
max_worker_processes = 12
max_parallel_workers_per_gather = 6
max_parallel_workers = 12
max_parallel_maintenance_workers = 4

# Logging (for development)
log_min_duration_statement = 100  # Log slow queries (>100ms)
log_line_prefix = '%t [%p] %u@%d '
log_checkpoints = on
log_connections = on
log_disconnections = on
log_lock_waits = on

# Auto-vacuum (keep database healthy)
autovacuum = on
autovacuum_max_workers = 4
autovacuum_naptime = 30s

# Other Performance Settings
synchronous_commit = off         # Faster writes (safe for dev)
full_page_writes = off          # Faster writes on SSD
fsync = on                      # Keep data safe
jit = on                        # Just-in-time compilation

# Windows Specific
update_process_title = off      # Better performance on Windows