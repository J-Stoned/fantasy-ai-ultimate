name: 🛡️ Elite Bundle Guard

on:
  pull_request:
    branches: [main, develop]
    paths:
      - 'apps/web/**'
      - 'package.json'
      - 'package-lock.json'
  push:
    branches: [main]
    paths:
      - 'apps/web/**'

jobs:
  bundle-analysis:
    name: 📊 Bundle Size Analysis
    runs-on: ubuntu-latest
    
    steps:
      - name: 🔍 Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: ⚡ Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      
      - name: 📦 Install dependencies
        run: npm ci
      
      - name: 🏗️ Build application
        run: |
          cd apps/web
          npm run build
        env:
          NODE_ENV: production
          SKIP_ENV_VALIDATION: true
      
      - name: 📊 Run bundle analysis
        id: bundle-analysis
        run: |
          node scripts/bundle-analyzer.js
          echo "analysis-result=$?" >> $GITHUB_OUTPUT
      
      - name: 📋 Upload bundle report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bundle-analysis-report
          path: bundle-analysis.json
          retention-days: 30
      
      - name: 📝 Comment PR with results
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = require('path');
            
            try {
              const reportPath = path.join(process.cwd(), 'bundle-analysis.json');
              if (!fs.existsSync(reportPath)) {
                console.log('Bundle analysis report not found');
                return;
              }
              
              const report = JSON.parse(fs.readFileSync(reportPath, 'utf8'));
              
              const formatBytes = (bytes) => {
                if (bytes === 0) return '0 B';
                const k = 1024;
                const sizes = ['B', 'KB', 'MB', 'GB'];
                const i = Math.floor(Math.log(bytes) / Math.log(k));
                return parseFloat((bytes / Math.pow(k, i)).toFixed(1)) + ' ' + sizes[i];
              };
              
              let comment = `## 📊 Bundle Analysis Report\n\n`;
              comment += `**Bundle Summary:**\n`;
              comment += `- 📦 Total Size: ${formatBytes(report.summary.totalSize)}\n`;
              comment += `- 📜 JavaScript: ${formatBytes(report.summary.jsSize)}\n`;
              comment += `- 🎨 CSS: ${formatBytes(report.summary.cssSize)}\n`;
              comment += `- 🖼️ Static Assets: ${formatBytes(report.summary.staticSize)}\n\n`;
              
              if (report.violations.length > 0) {
                comment += `## 🚨 Size Violations (${report.violations.length})\n\n`;
                report.violations.slice(0, 5).forEach(v => {
                  if (v.type === 'budget') {
                    comment += `- ❌ ${v.category}: Exceeds budget by ${formatBytes(v.excess)}\n`;
                  } else {
                    comment += `- ❌ ${v.file}: ${formatBytes(v.size)} (+${v.percentage}% over limit)\n`;
                  }
                });
                if (report.violations.length > 5) {
                  comment += `- ... and ${report.violations.length - 5} more violations\n`;
                }
              } else {
                comment += `## ✅ All Bundle Sizes Within Limits!\n\n`;
              }
              
              if (report.recommendations.length > 0) {
                comment += `\n## 💡 Optimization Recommendations (${report.recommendations.length})\n\n`;
                report.recommendations.slice(0, 3).forEach(r => {
                  comment += `- 💡 ${r.suggestion}\n`;
                });
                if (report.recommendations.length > 3) {
                  comment += `- ... and ${report.recommendations.length - 3} more recommendations\n`;
                }
              }
              
              comment += `\n---\n*Bundle analysis powered by Elite Bundle Guard 🛡️*`;
              
              github.rest.issues.createComment({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: comment
              });
              
            } catch (error) {
              console.error('Error creating PR comment:', error);
            }
      
      - name: 🚫 Fail on violations
        if: steps.bundle-analysis.outputs.analysis-result != '0'
        run: |
          echo "❌ Bundle analysis failed! Bundle sizes exceed acceptable limits."
          echo "Please optimize your code before merging."
          exit 1

  bundle-comparison:
    name: 📈 Bundle Size Comparison  
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    
    steps:
      - name: 🔍 Checkout PR
        uses: actions/checkout@v4
        
      - name: ⚡ Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          
      - name: 📦 Install dependencies
        run: npm ci
        
      - name: 🏗️ Build PR version
        run: |
          cd apps/web
          npm run build
        env:
          NODE_ENV: production
          SKIP_ENV_VALIDATION: true
          
      - name: 📊 Analyze PR bundle
        run: |
          node scripts/bundle-analyzer.js
          mv bundle-analysis.json bundle-analysis-pr.json
          
      - name: 🔍 Checkout main branch
        uses: actions/checkout@v4
        with:
          ref: main
          
      - name: 📦 Install main dependencies
        run: npm ci
        
      - name: 🏗️ Build main version
        run: |
          cd apps/web
          npm run build
        env:
          NODE_ENV: production
          SKIP_ENV_VALIDATION: true
          
      - name: 📊 Analyze main bundle
        run: |
          node scripts/bundle-analyzer.js
          mv bundle-analysis.json bundle-analysis-main.json
          
      - name: 📈 Compare bundles
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            
            try {
              const prReport = JSON.parse(fs.readFileSync('bundle-analysis-pr.json', 'utf8'));
              const mainReport = JSON.parse(fs.readFileSync('bundle-analysis-main.json', 'utf8'));
              
              const formatBytes = (bytes) => {
                if (bytes === 0) return '0 B';
                const k = 1024;
                const sizes = ['B', 'KB', 'MB', 'GB'];
                const i = Math.floor(Math.log(bytes) / Math.log(k));
                return parseFloat((bytes / Math.pow(k, i)).toFixed(1)) + ' ' + sizes[i];
              };
              
              const formatChange = (current, previous) => {
                const diff = current - previous;
                const percent = previous > 0 ? ((diff / previous) * 100).toFixed(1) : 0;
                const sign = diff > 0 ? '+' : '';
                const emoji = diff > 0 ? '📈' : diff < 0 ? '📉' : '➡️';
                return `${emoji} ${sign}${formatBytes(diff)} (${sign}${percent}%)`;
              };
              
              let comment = `## 📈 Bundle Size Comparison\n\n`;
              comment += `| Category | Main | PR | Change |\n`;
              comment += `|----------|------|----|---------|\n`;
              comment += `| Total | ${formatBytes(mainReport.summary.totalSize)} | ${formatBytes(prReport.summary.totalSize)} | ${formatChange(prReport.summary.totalSize, mainReport.summary.totalSize)} |\n`;
              comment += `| JavaScript | ${formatBytes(mainReport.summary.jsSize)} | ${formatBytes(prReport.summary.jsSize)} | ${formatChange(prReport.summary.jsSize, mainReport.summary.jsSize)} |\n`;
              comment += `| CSS | ${formatBytes(mainReport.summary.cssSize)} | ${formatBytes(prReport.summary.cssSize)} | ${formatChange(prReport.summary.cssSize, mainReport.summary.cssSize)} |\n`;
              comment += `| Static | ${formatBytes(mainReport.summary.staticSize)} | ${formatBytes(prReport.summary.staticSize)} | ${formatChange(prReport.summary.staticSize, mainReport.summary.staticSize)} |\n\n`;
              
              const totalDiff = prReport.summary.totalSize - mainReport.summary.totalSize;
              if (totalDiff > 50000) { // 50KB threshold
                comment += `⚠️ **Warning**: Bundle size increased by ${formatBytes(totalDiff)}. Consider optimizing.\n\n`;
              } else if (totalDiff < -10000) { // 10KB improvement
                comment += `🎉 **Great job!** Bundle size reduced by ${formatBytes(Math.abs(totalDiff))}.\n\n`;
              }
              
              comment += `*Comparison generated by Elite Bundle Guard 🛡️*`;
              
              github.rest.issues.createComment({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: comment
              });
              
            } catch (error) {
              console.error('Error comparing bundles:', error);
            }